<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Usuario</title>
    <link rel="stylesheet" href="/css/dashboard.css">

<body>
    <header>
        <div class="nav-container">
            <div class="logo">
                <img src="img/pololitosBlanco.png" alt="Logo pololitos">
